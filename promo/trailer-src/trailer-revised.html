<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mythos Unbound — revised landscape trailer</title>
<link rel="icon" href="site/favicon.svg">
<style>
@font-face { font-family:Cinzel; font-weight:700; src:url(fonts/Cinzel-700.ttf); }
@font-face { font-family:Cinzel; font-weight:900; src:url(fonts/Cinzel-900.ttf); }
@font-face { font-family:Inter; font-weight:600; src:url(fonts/Inter-600.ttf); }
@font-face { font-family:Inter; font-weight:700; src:url(fonts/Inter-700.ttf); }
@font-face { font-family:Inter; font-weight:800; src:url(fonts/Inter-800.ttf); }
:root { --bone:#ede6d6; --blood:#c4442c; --accent:#8fb4e8; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:#0b0808; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; color:var(--bone); font-family:Inter,sans-serif; background:#0b0808; }
#stage,.scene { position:absolute; inset:0; }
.scene { display:none; }
.glow { position:absolute; inset:0; background:radial-gradient(ellipse 65% 70% at 50% 60%,rgba(150,40,24,.38),transparent 75%); }
.portrait { position:absolute; bottom:-35px; width:650px; height:830px; object-fit:contain; object-position:bottom; filter:drop-shadow(0 24px 40px #000); }
.headline { position:absolute; left:80px; right:80px; top:62px; text-align:center; font:700 76px/1.12 Cinzel,serif; text-shadow:0 3px 24px #000; }
.name { position:absolute; top:244px; width:760px; text-align:center; font:700 46px/1 Cinzel,serif; letter-spacing:.06em; color:var(--accent); text-shadow:0 3px 14px #000; }
.badge { position:absolute; bottom:85px; width:760px; text-align:center; }
.badge b { display:inline-block; padding:12px 22px; border-radius:4px; background:var(--accent); color:#101018; font:800 36px/1.2 Inter,sans-serif; }
.badge span { display:block; margin-top:10px; font:600 28px/1.2 Inter,sans-serif; text-shadow:0 3px 12px #000; }
#mark { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); font:900 100px/1 Cinzel,serif; color:var(--blood); text-shadow:0 0 28px #7b231c; }
#introPortrait { left:620px; width:680px; height:1040px; opacity:.6; }
#introText { top:405px; font-size:92px; }
#introName { position:absolute; bottom:92px; width:100%; text-align:center; color:#cfbfb0; font:700 34px Cinzel,serif; letter-spacing:.18em; }
#footage { position:absolute; inset:0; width:1920px; height:1080px; }
#footScrim { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(8,6,6,.78),transparent 32%),linear-gradient(to top,rgba(8,6,6,.55),transparent 21%); }
#caption { position:absolute; left:105px; top:65px; max-width:1700px; }
#caption h2 { font:700 72px/1.12 Cinzel,serif; text-shadow:0 3px 16px #000; }
#caption p { margin-top:16px; font:600 34px/1.3 Inter,sans-serif; color:var(--accent); text-shadow:0 2px 12px #000; }
#realm { position:absolute; left:105px; bottom:72px; font:700 30px/1.2 Inter,sans-serif; letter-spacing:.14em; text-transform:uppercase; text-shadow:0 3px 14px #000; }
#draftSuccess { position:absolute; right:100px; bottom:72px; padding:16px 26px; background:#8fb4e8; color:#101018; font:800 34px/1 Inter,sans-serif; border-radius:5px; }
#soloPortrait { left:930px; width:760px; height:1000px; }
#soloLabel { position:absolute; left:140px; top:420px; }
#soloLabel h2 { font:900 104px/1 Cinzel,serif; color:var(--accent); }
#soloLabel p { font:600 32px Inter,sans-serif; text-transform:uppercase; letter-spacing:.25em; margin-top:22px; }
#wall { position:absolute; inset:0; display:grid; grid-template-columns:repeat(11,1fr); grid-template-rows:repeat(6,1fr); }
#wall div { overflow:hidden; background:radial-gradient(ellipse at 50% 35%,#2a2321,#120e0e 75%); border:1px solid #090808; }
#wall img { width:100%; height:100%; object-fit:cover; object-position:top; }
#wallBand { position:absolute; top:440px; width:100%; padding:35px 0; text-align:center; background:rgba(12,9,9,.9); border-block:2px solid var(--blood); font:700 84px/1 Cinzel,serif; }
#title h1 { position:absolute; left:0; right:0; top:80px; text-align:center; font:900 170px/.95 Cinzel,serif; letter-spacing:.02em; text-shadow:0 5px 40px #000; }
#title h1 span { color:var(--blood); }
#trio { position:absolute; inset:0; opacity:.52; }
#trio img { position:absolute; object-fit:contain; object-position:bottom; bottom:-70px; }
#endOdin { height:570px; width:520px; left:380px; filter:brightness(.75); }
#endZeus { height:710px; width:600px; left:660px; }
#endAnubis { height:570px; width:520px; left:1030px; filter:brightness(.75); }
#cta { position:absolute; top:465px; width:100%; text-align:center; }
#cta strong { display:inline-block; padding:17px 36px; color:#110d0c; background:var(--bone); border-radius:5px; font:800 44px/1.1 Inter,sans-serif; }
#cta p { font:700 44px/1.3 Inter,sans-serif; margin-top:25px; text-shadow:0 3px 14px #000; }
#cta small { display:block; margin-top:15px; font:600 29px/1 Inter,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
#vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 90% 85% at 50% 50%,transparent 65%,rgba(0,0,0,.55)); }
#black { position:absolute; inset:0; background:#000; opacity:0; }
</style>
</head>
<body>
<div id="root">
 <div id="stage">
  <section class="scene" id="intro"><div class="glow"></div><img id="introPortrait" class="portrait" src="site/assets/units/cronus-lg.webp"><h2 id="introText" class="headline">Every god has a family.</h2><p id="introName">Cronus</p></section>
  <section class="scene" id="duel"><div class="glow"></div><h2 id="duelHeadline" class="headline"></h2><img id="leftPortrait" class="portrait"><img id="rightPortrait" class="portrait"><p id="leftName" class="name" style="left:150px"></p><p id="rightName" class="name" style="right:150px"></p><div id="mark"></div><div id="leftBadge" class="badge" style="left:150px"><b></b><span></span></div><div id="rightBadge" class="badge" style="right:150px"><b></b><span></span></div></section>
  <section class="scene" id="foot"><canvas id="footage" width="1920" height="1080"></canvas><div id="footScrim"></div><div id="caption"><h2></h2><p></p></div><div id="realm"></div><div id="draftSuccess">Zeus selected ✓</div></section>
  <section class="scene" id="solo"><div class="glow"></div><img id="soloPortrait" class="portrait"><div id="soloLabel"><h2></h2><p></p></div></section>
  <section class="scene" id="roster"><div id="wall"></div><div id="wallBand">66 legends · 3 pantheons</div></section>
  <section class="scene" id="title"><div class="glow"></div><div id="trio"><img id="endOdin" src="site/assets/units/odin-lg.webp"><img id="endZeus" src="site/assets/units/zeus-lg.webp"><img id="endAnubis" src="site/assets/units/anubis-lg.webp"></div><h1>Mythos<br><span>Unbound</span></h1><div id="cta"><strong>Play free in your browser</strong><p>dhuovinen.github.io/mythos-unbound</p><small>Draft the family. Decide the fight.</small></div></section>
 </div>
 <div id="vignette"></div><div id="black"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const progress = (t,a,b) => clamp((t-a)/(b-a));
const ease = u => 1-Math.pow(1-u,3);
const show = id => document.querySelectorAll('.scene').forEach(s => s.style.display = s.id===id?'block':'none');
const portraits = {
 cronus:'Cronus',zeus:'Zeus',ares:'Ares',aphrodite:'Aphrodite',thor:'Thor',jormungandr:'Jörmungandr',odin:'Odin',ra:'Ra',anubis:'Anubis'
};
const imageCache = new Map();
async function load(src) {
 if (!imageCache.has(src)) {
  const im = new Image(); im.src=src; imageCache.set(src,im.decode().then(()=>im));
  if(imageCache.size>24)imageCache.delete(imageCache.keys().next().value);
 }
 return imageCache.get(src);
}
function sourcePortrait(el,id) { el.src=`site/assets/units/${id}-lg.webp`; }

function intro(t) {
 show('intro'); const u=t-1;
 $('introPortrait').style.transform=`scale(${1.04+.06*u/1.5})`;
 $('introText').style.opacity=ease(progress(u,0,.2));
 $('introText').style.transform=`translateY(${12*(1-ease(progress(u,0,.2)))}px)`;
 $('introName').style.opacity=ease(progress(u,.05,.3));
}

const DUELS = [
 { start:2.5,end:5,a:'cronus',b:'zeus',head:'Every family has a grudge.',mark:'VS',accent:'#8fb4e8',left:['Father against son','Cronus strikes his children harder'],right:['Son against father','Zeus strikes back harder'] },
 { start:5,end:7,a:'ares',b:'aphrodite',head:'Lovers won’t strike.',mark:'♥',accent:'#e58fb0',left:['Love stops attacks','Ares and Aphrodite refuse to fight'],right:null },
 { start:9,end:11,a:'thor',b:'jormungandr',head:'Old deaths are never forgotten.',mark:'VS',accent:'#7fd6d0',left:['Vengeance · 2× damage','Armour ignored'],right:['Vengeance · 2× damage','Armour ignored'] },
];
function duel(t,d) {
 show('duel'); $('duel').style.setProperty('--accent',d.accent);
 const u=t-d.start,k=ease(progress(u,0,.22));
 $('duelHeadline').textContent=d.head;
 $('duelHeadline').style.opacity=k;
 sourcePortrait($('leftPortrait'),d.a); sourcePortrait($('rightPortrait'),d.b);
 $('leftPortrait').style.left=`${155-(1-k)*160}px`;
 $('rightPortrait').style.right=`${155-(1-k)*160}px`;
 $('leftPortrait').style.transform=`scale(${1+.025*u})`;
 $('rightPortrait').style.transform=`scaleX(-1) scale(${1+.025*u})`;
 $('leftPortrait').style.opacity=$('rightPortrait').style.opacity=k;
 $('leftName').textContent=portraits[d.a]; $('rightName').textContent=portraits[d.b];
 $('leftName').style.opacity=$('rightName').style.opacity=k;
 $('mark').textContent=d.mark; $('mark').style.color=d.mark==='♥'?'#e58fb0':'#c4442c';
 $('mark').style.opacity=ease(progress(u,.1,.3));
 for (const [id,data] of [['leftBadge',d.left],['rightBadge',d.right]]) {
  const el=$(id); el.style.display=data?'block':'none';
  if (data) { el.querySelector('b').textContent=data[0];el.querySelector('span').textContent=data[1];el.style.opacity=ease(progress(u,.15,.4)); }
 }
 if(!d.right) { $('leftBadge').style.left='580px';$('leftBadge').style.width='760px'; }
 else { $('leftBadge').style.left='150px';$('leftBadge').style.width='760px'; }
}

// Raw recordings are spliced and reframed here; no original text/flash is baked in.
const FOOTAGE = [
 {start:0,end:1,dir:'norse',source:45,frames:75,cx:.54,cy:.65,z:1.9,head:'Family ties decide the fight.',sub:'',realm:'Actual gameplay',accent:'#7fd6d0'},
 {start:7,end:9,dir:'greek',source:0,frames:75,cx:.555,cy:.65,z:1.75,head:'Love stops attacks.',sub:'Entranced · attacks refused',realm:'Olympus · Greek',accent:'#e58fb0'},
 {start:11,end:13.5,dir:'norse',source:0,frames:75,cx:.54,cy:.65,z:1.65,head:'Old enemies. Double damage.',sub:'Vengeance · armour ignored',realm:'Asgard · Norse',accent:'#7fd6d0'},
 {start:13.5,end:16.5,dir:'draft',source:0,frames:90,cx:.5,cy:.5,z:1,head:'Draft the family.',sub:'Choose your opening gods',realm:'Pick from the family tree',accent:'#8fb4e8'},
 {start:16.5,end:18,dir:'egyptian',source:0,frames:45,cx:.46,cy:.64,z:1.55,head:'Three worlds. One battlefield.',sub:'Greek · Norse · Egyptian',realm:'The Nile · Egyptian',accent:'#e19a7e'},
];
async function footage(t,c) {
 show('foot'); const u=t-c.start;
 const f=Math.min(c.frames-1,c.source+Math.floor((u+1e-8)*30));
 const im=await load(`frames/${c.dir}/${String(f).padStart(4,'0')}.jpg`);
 const z=c.z+(c.dir==='draft'?0:.035*u);
 const sw=im.width/z,sh=sw*1080/1920;
 const x=clamp(c.cx*im.width-sw/2,0,im.width-sw), y=clamp(c.cy*im.height-sh/2,0,im.height-sh);
 const ctx=$('footage').getContext('2d');
 if(c.dir==='draft') {ctx.fillStyle='#0b0808';ctx.fillRect(0,0,1920,1080);ctx.drawImage(im,140,220,1640,922.5);}
 else ctx.drawImage(im,x,y,sw,sh,0,0,1920,1080);
 $('foot').style.setProperty('--accent',c.accent);
 $('caption').querySelector('h2').textContent=c.head;
 $('caption').querySelector('p').textContent=c.sub;
 $('caption').style.opacity=ease(progress(u,0,.16));
 $('realm').textContent=c.realm;
 $('draftSuccess').style.display=c.dir==='draft'&&u>=1.1?'block':'none';
 $('draftSuccess').style.opacity=ease(progress(u,1.1,1.3));
}

const SOLOS=[['odin','Norse','#7fd6d0'],['ra','Egyptian','#e19a7e'],['anubis','Egyptian','#e19a7e']];
function solo(t) {
 show('solo'); const i=Math.min(2,Math.floor((t-18)/.5)), u=t-18-i*.5;
 const [id,realm,accent]=SOLOS[i]; $('solo').style.setProperty('--accent',accent);
 sourcePortrait($('soloPortrait'),id); $('soloPortrait').style.transform=`scale(${1.05-.05*ease(u/.5)})`;
 $('soloLabel').querySelector('h2').textContent=portraits[id];$('soloLabel').querySelector('p').textContent=realm;
}
const ROSTER=['cronus','typhon','fenrir','jormungandr','apep','ammit','zeus','hera','poseidon','hades','athena','ares','aphrodite','hephaestus','apollo','artemis','odin','thor','loki','baldr','frigg','freyja','freyr','tyr','heimdall','njord','ra','osiris','isis','set','horus','nephthys','thoth','hathor','sekhmet','ptah','heracles','perseus','achilles','asclepius','orpheus','dionysus','aeneas','sigurd','vidar','brynhildr','hodr','vali','magni','skadi','anubis','wepwawet','imhotep','nefertem','maahes','bes','khonsu','hoplite','satyr','harpy','einherjar','draugr','valkyrie','medjay','shabti','ba'];
const cells=ROSTER.map((id,i)=>{const el=document.createElement('div');const im=document.createElement('img');im.src=`site/assets/units/${id}.webp`;el.append(im);$('wall').append(el);return el;});
function roster(t) {
 show('roster'); const u=t-19.5;
 cells.forEach((el,i)=>{const k=ease(progress(u,(i%11)*.012,.22+(i%11)*.012));el.style.opacity=k;});
 $('wall').style.transform=`scale(${1+.04*u})`;
 $('wallBand').style.opacity=ease(progress(u,.15,.35));
}
function title(t) {
 show('title');const u=t-21.5;
 $('title').querySelector('h1').style.transform=`scale(${1.12-.12*ease(progress(u,0,.24))})`;
 $('cta').style.opacity=ease(progress(u,.12,.45));
 $('trio').style.transform=`scale(${1+.008*u})`;
}
window.renderFrame=async t=>{
 if(t<0||t>=26) throw new Error('Frame time must be within the 26-second timeline');
 const c=FOOTAGE.find(c=>t>=c.start&&t<c.end),d=DUELS.find(d=>t>=d.start&&t<d.end);
 if(c)await footage(t,c); else if(d)duel(t,d); else if(t<2.5)intro(t); else if(t<19.5)solo(t); else if(t<21.5)roster(t);else title(t);
 // Two brief shakes only: the visible vengeance hit and the title landing. No white flashes.
 let sx=0,sy=0;
 for(const [at,amp] of [[13.03,6],[21.5,8]])if(t>=at&&t<at+.24){const k=amp*Math.exp(-(t-at)*18);sx+=Math.sin(t*103)*k;sy+=Math.cos(t*137)*k;}
 $('stage').style.transform=`translate(${sx}px,${sy}px)`;
 $('black').style.opacity=progress(t,25.5,25.97);
 await Promise.all([...document.images].filter(im=>im.offsetParent!==null).map(im=>im.decode()));
};
window.ready=(async()=>{
 await Promise.all([document.fonts.load('700 76px Cinzel'),document.fonts.load('900 170px Cinzel'),document.fonts.load('600 34px Inter'),document.fonts.load('700 44px Inter'),document.fonts.load('800 44px Inter')]);
 await Promise.all([...document.images].filter(im=>im.getAttribute('src')).map(im=>im.decode()));
})();
</script>
</body>
</html>
