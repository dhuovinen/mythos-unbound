<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mythos Unbound — Rig scenario</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0 auto; max-width: 1280px; background: #11121a; color: #e8dcc4; font-family: ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      canvas { display: block; background: #231f26; border-radius: 6px; }
      .group { margin: 22px 0 6px; }
      .group h3 { margin: 0 0 8px; font-size: 14px; color: #a99c85; text-transform: uppercase; letter-spacing: .8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .cell { background: #1b1720; border: 1px solid #3a3229; border-radius: 8px; padding: 6px; font-size: 11px; color: #a99c85; text-align: center; }
      .cell canvas { background: #2a2530; border-radius: 4px; }
      .label { font-size: 11px; color: #857a68; margin: 8px 0 4px; text-transform: uppercase; letter-spacing: .6px; }
    </style>
  </head>
  <body>
    <a href="/" style="display:inline-block; color:#aaa6ae; font-size:12px; margin-bottom:20px">← Back to game</a>
    <div id="explorer"></div>
    <details style="margin-top:30px">
      <summary style="cursor:pointer; color:#aaa6ae">Shared parts library</summary>
      <div id="parts"></div>
    </details>
    <script type="module" src="/src/render/rig/preview.ts"></script>
  </body>
</html>
