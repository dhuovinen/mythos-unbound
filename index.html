<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theomachy</title>
    <style>
      :root {
        color-scheme: dark;
        --bone: #e8dcc4;
        --ink: #141010;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ink);
        color: var(--bone);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #stage {
        display: block;
        max-width: 100%;
        background: #1d1a17;
        border: 1px solid #3a3229;
      }
      #hud {
        min-height: 96px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage" width="960" height="540"></canvas>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
